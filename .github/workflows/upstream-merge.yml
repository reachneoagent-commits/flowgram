name: Prepare Harper merge

# Run this by hand after reading the "Harper update available" issue. It merges Harper on a new
# branch, keeps Gramflow's name/version/updater settings, runs the tests and the branding check,
# and opens a pull request. Merge the pull request yourself once you are happy with it.

on:
  workflow_dispatch:
    inputs:
      skip_paths:
        description: "Folders to keep exactly as Gramflow has them (Harper's website, other editors)"
        default: "packages/web .buildkite packages/wordpress-plugin packages/obsidian-plugin packages/vscode-plugin"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Merge Harper on a new branch
        id: merge
        run: |
          git config user.name "gramflow-upstream-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/Automattic/harper.git
          git fetch upstream master
          BRANCH="harper-merge/$(date +%Y-%m-%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          if git merge upstream/master --no-commit --no-ff; then :; else
            python3 scripts/upstream/resolve_conflicts.py
          fi
          for path in ${{ inputs.skip_paths }}; do
            git checkout HEAD -- "$path" 2>/dev/null || true
          done
          python3 scripts/upstream/sync_versions.py
          git add -A
          git commit -m "Merge Harper master into Gramflow"
      - name: Branding check
        run: bash scripts/upstream/check_branding.sh
      - name: Run the grammar engine tests
        run: cargo test -p harper-core
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"
          BASE=$(git merge-base origin/${{ github.event.repository.default_branch }} upstream/master)
          {
            python3 scripts/upstream/summarize.py "$BASE" upstream/master
            echo "---"
            echo "Branding check and \`harper-core\` tests passed. The desktop app and extensions are built in the release workflow, so run a test release before publishing."
          } > /tmp/pr.md
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Merge Harper updates" --body-file /tmp/pr.md
