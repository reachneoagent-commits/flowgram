name: Gramflow Release

# Builds Gramflow installers for macOS (Apple Silicon + Intel) and Windows (x64 + ARM64)
# and attaches them to a GitHub release. Run it manually from the Actions tab.
# Installers are not signed with paid Apple/Microsoft certificates; the README explains
# how users open them. Updater artifacts are signed with TAURI_SIGNING_PRIVATE_KEY.

on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' harper-desktop/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `Gramflow ${{ steps.get-version.outputs.version }}`,
              body: [
                '## Download the installer for your computer',
                '',
                '| System | File |',
                '|---|---|',
                '| Mac with an M1, M2, M3 or newer chip | `Gramflow_..._Mac_Apple-Silicon.dmg` |',
                '| Mac with an Intel chip | `Gramflow_..._Mac_Intel.dmg` |',
                '| Windows (most PCs) | `.exe` ending in `x64-setup` |',
                '| Windows on ARM | `.exe` ending in `arm64-setup` |',
                '',
                'Your computer will warn you the first time you open Gramflow because it is not signed with a paid certificate. The steps to get past that are in the [README](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '#download-and-install).',
              ].join('\n'),
              draft: true,
              prerelease: false,
            })
            return data.id

  # The browser extensions are the same on every OS, so build them once on Linux.
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache: false
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the Chrome and Firefox extensions
        run: just build-chrome-plugin build-firefox-unpacked
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: |
            packages/chrome-plugin/build
            packages/chrome-plugin/build-firefox
          if-no-files-found: error

  build:
    needs: [create-release, extensions]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin --bundles app,dmg"
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
          - platform: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            tauri-args: "--target aarch64-pc-windows-msvc --bundles nsis,msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        if: matrix.platform != 'windows-11-arm'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.rust-target }}
          cache: false
      - name: Install just (Windows ARM)
        if: matrix.platform == 'windows-11-arm'
        run: cargo install just --locked
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build shared packages
        shell: bash
        run: just build-harperjs build-lint-framework build-components build-harper-editor
      - name: Download the browser extensions
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: packages/chrome-plugin
      - name: Install desktop dependencies
        shell: bash
        run: cd harper-desktop && pnpm install
      - name: Add the Humanizer engine
        shell: bash
        run: |
          # Humanizer runs a llama.cpp server that ships inside the app. Apple silicon and Windows x64
          # get the real engine; other platforms get a placeholder so the bundle folder exists
          # (Settings tells those users Humanizer isn't available on their computer).
          TAG=b11335
          BASE="https://github.com/ggml-org/llama.cpp/releases/download/$TAG"
          DEST=harper-desktop/src-tauri/engine-bundle
          mkdir -p "$DEST" engine-tmp
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin)
              curl -fsSL "$BASE/llama-$TAG-bin-macos-arm64.tar.gz" -o engine.archive
              tar -xzf engine.archive -C engine-tmp ;;
            x86_64-pc-windows-msvc)
              curl -fsSL "$BASE/llama-$TAG-bin-win-vulkan-x64.zip" -o engine.archive
              7z x -y engine.archive -oengine-tmp > /dev/null ;;
            *)
              echo "Humanizer is not offered on this platform." > "$DEST/README.txt" ;;
          esac
          SERVER=$(find engine-tmp -type f \( -name llama-server -o -name llama-server.exe \) | head -1)
          if [ -n "$SERVER" ]; then
            cp -R "$(dirname "$SERVER")"/. "$DEST"/
          fi
          ls "$DEST"
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: harper-desktop
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.tauri-args }}
          includeUpdaterJson: true

  # Gives the Mac installers plain names and publishes the release once every build is done.
  finish:
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Rename Mac installers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case "$name" in
              *_aarch64.dmg) new="Gramflow_${VERSION}_Mac_Apple-Silicon.dmg" ;;
              *_x64.dmg) new="Gramflow_${VERSION}_Mac_Intel.dmg" ;;
              *) continue ;;
            esac
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" > /dev/null
            echo "$name -> $new"
          done
