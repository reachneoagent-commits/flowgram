<!DOCTYPE html>
<html>
  <body>
    <!-- Shaped like Gmail's compose body: a contenteditable textbox with one div per line. -->
    <div
      id="compose"
      role="textbox"
      aria-multiline="true"
      contenteditable="true"
      g_editable="true"
      style="min-height: 200px; border: 1px solid #ccc; padding: 8px; font: 14px Arial"
    ><div><br /></div></div>
  </body>
</html>
