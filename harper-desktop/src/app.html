<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowgram Desktop</title>
    %sveltekit.head%
    <script>
      // Show start-up crashes on screen instead of leaving a blank white window.
      (function () {
        function show(message) {
          var box = document.getElementById('flowgram-error');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'flowgram-error';
            box.style.cssText =
              'position:fixed;inset:0;margin:0;padding:16px;overflow:auto;z-index:99999;' +
              'background:#fff;color:#b00020;font:13px/1.4 Consolas,monospace;white-space:pre-wrap';
            box.textContent = 'Flowgram could not draw this window. Please send a screenshot of this to support.\n\n';
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += message + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '') +
            (e.error && e.error.stack ? '\n' + e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled: ' + ((r && (r.stack || r.message)) || String(r)));
        });
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
